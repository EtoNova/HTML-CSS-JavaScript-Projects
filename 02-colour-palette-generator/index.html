<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colour Palette Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Colour Palette Generator</h1>

      <button id="generate-btn">
        <i class="fas fa-sync-alt"></i>
        Generate Palette
      </button>

      <div class="palette-container">
        <!-- COLOUR BOXES -->
        <div class="colour-box">
          <div class="colour" style="background-color: #d3e7f8"></div>
          <div class="colour-info">
            <span>#D3E7f8</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>

        <div class="colour-box">
          <div class="colour" style="background-color: #d3f8e1"></div>
          <div class="colour-info">
            <span>#D3F8E1</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>

        <div class="colour-box">
          <div class="colour" style="background-color: #f8e7d3"></div>
          <div class="colour-info">
            <span>#F8E7D3</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>

        <div class="colour-box">
          <div class="colour" style="background-color: #f3f8d3"></div>
          <div class="colour-info">
            <span>#F3F8D3</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>

        <div class="colour-box">
          <div class="colour" style="background-color: #e7d3f8"></div>
          <div class="colour-info">
            <span>#E7D3F8</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
